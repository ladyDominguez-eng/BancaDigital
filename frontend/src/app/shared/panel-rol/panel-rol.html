<div class="app-marco">
  <aside class="lateral">
    <div class="lateral-marca">
      <div class="lateral-logo" aria-hidden="true"><span></span></div>
      <div class="lateral-nombre">
        <strong>Banca Digital</strong>
        <span>{{ titulo }}</span>
      </div>
    </div>

    <nav class="lateral-nav" aria-label="Menú principal">
      @for (e of enlaces; track e.ruta) {
        <a [routerLink]="e.ruta" routerLinkActive="active">{{ e.texto }}</a>
      }
    </nav>

    <div class="lateral-pie">
      @if (usuario) {
        <span class="lateral-usuario">Sesión iniciada como <strong>{{ usuario }}</strong></span>
      }
      <button type="button" class="btn secundario" (click)="salir()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="contenido">
    <div class="contenido-interior">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
