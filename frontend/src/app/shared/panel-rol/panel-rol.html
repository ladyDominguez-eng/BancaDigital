<header class="topbar">
  <div class="topbar-brand">
    <div class="logo" aria-hidden="true">
      <span class="logo-inner"></span>
    </div>
    <div class="brand-text">
      <span class="brand-name">Banca Digital</span>
      <span class="brand-role">• {{ titulo }}</span>
    </div>
  </div>

  <nav class="topbar-nav">
    @for (e of enlaces; track e.ruta) {
      <a [routerLink]="e.ruta" routerLinkActive="active" class="nav-link">{{ e.texto }}</a>
    }
  </nav>

  @if (usuario) {
    <span class="usuario">{{ usuario }}</span>
  }
  <button type="button" class="btn-salir" (click)="salir()">Salir</button>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
