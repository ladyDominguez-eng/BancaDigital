

    <div class="background">
        <div class="bg-img"></div>
        <div class="bg-overlay"></div>

        <!-- Decoración: "ATM" a la izquierda -->
        <div class="atm" aria-hidden="true">
            <div class="atm-screen"></div>
            <div class="atm-slot"></div>
            <div class="atm-slot small"></div>
        </div>

        <!-- Decoración: personas en ventanilla a la derecha -->
        <div class="counter" aria-hidden="true">
            <span class="person p1"></span>
            <span class="person p2"></span>
            <span class="desk"></span>
        </div>
    </div>

    <main class="login-wrapper">
        <form class="login-card" autocomplete="off" (ngSubmit)="ingresar()">
  <h1 class="brand">BancaDigital</h1>

  <div class="field">
    <label for="rol">Tipo de usuario</label>
    <select id="rol" name="rol" [(ngModel)]="rol" required>
      <option value="" disabled selected>Selecciona tu rol</option>
      <option value="ADMIN">Administrador</option>
      <option value="CLIENTE">Cliente</option>
      <option value="ASESOR">Asesor de Credito</option>
      <option value="CAJERO">Cajero</option>
    </select>
  </div>

  <div class="field">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="username" [(ngModel)]="username" placeholder="Ingresa tu usuario" required>
  </div>

  <div class="field">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Ingresa tu contraseña" required>
  </div>

  <button type="submit" class="btn-ingresar">Ingresar</button>
</form>


    </main>
