<h1 class="vista-titulo">Pagar servicios</h1>

@if (mensaje()) {
  <p class="vista-aviso error">{{ mensaje() }}</p>
}

@if (comprobante(); as t) {
  <div class="vista-comprobante" role="status">
    <p class="vista-aviso">Pago realizado.</p>
    <p>Comprobante <strong>{{ t.comprobante }}</strong></p>
    <p>Cuenta {{ t.cuentaOrigen }} · S/ {{ t.monto | number:'1.2-2' }}</p>
    <p>{{ t.fecha | date:'dd/MM/yyyy HH:mm' }}</p>
  </div>
}

<section class="vista-panel">
  <form class="vista-form" (ngSubmit)="pagar()">
    <div class="vista-campo">
      <label for="cuenta">Pagar desde</label>
      <select id="cuenta" name="cuenta" [(ngModel)]="cuentaId">
        @for (c of cuentas(); track c.id) {
          <option [ngValue]="c.id">{{ c.numero }} · S/ {{ c.saldoDisponible | number:'1.2-2' }} disponibles</option>
        }
      </select>
    </div>

    <div class="vista-campo">
      <label for="servicio">Servicio</label>
      <select id="servicio" name="servicio" [(ngModel)]="servicio">
        @for (s of servicios(); track s.codigo) {
          <option [value]="s.codigo">{{ s.nombre }}</option>
        }
      </select>
    </div>

    <div class="vista-campo">
      <label for="monto">Monto (S/)</label>
      <input id="monto" name="monto" type="number" min="0" step="0.01" [(ngModel)]="monto" placeholder="0.00">
    </div>

    <button type="submit" class="vista-btn" [disabled]="enviando()">Pagar</button>
  </form>
</section>
