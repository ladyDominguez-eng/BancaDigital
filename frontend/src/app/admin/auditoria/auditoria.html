<h1 class="page-title">Auditoría</h1>

<section class="panel">

  <h2>Filtros</h2>

  <div class="filtros">

    <div>
      <label>Usuario ID</label>
      <input
        type="number"
        placeholder="ID del usuario"
        #usuario>
    </div>

    <div>
      <label>Fecha desde</label>
      <input
        type="date"
        #desde>
    </div>

    <div>
      <label>Fecha hasta</label>
      <input
        type="date"
        #hasta>
    </div>

    <button
      type="button"
      (click)="
        usuarioId.set(
          usuario.value ? +usuario.value : undefined
        );
        fechaDesde.set(desde.value);
        fechaHasta.set(hasta.value);
        cargarAuditoria()
      ">
      Filtrar
    </button>

    

  </div>

</section>

<section class="panel">

  <h2>Registro de auditoría</h2>

  <table>

    <thead>
      <tr>
        <th>Fecha</th>
        <th>Usuario</th>
        <th>Rol</th>
        <th>Acción</th>
      </tr>
    </thead>

    <tbody>

      @for (registro of registros(); track registro.id) {

        <tr>
          <td>
            {{ registro.fecha | date:'dd/MM/yyyy HH:mm' }}
          </td>

          <td>
            {{ registro.username }}
          </td>

          <td>
            {{ registro.rol }}
          </td>

          <td>
            {{ registro.accion }}
          </td>
        </tr>

      }

      @if (registros().length === 0) {

        <tr>
          <td colspan="4">
            No hay registros de auditoría.
          </td>
        </tr>

      }

    </tbody>

  </table>

</section>
