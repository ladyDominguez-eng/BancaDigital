<!-- Fondo decorativo -->
<div class="background">
  <div class="bg-img"></div>
  <div class="bg-overlay"></div>

  <!-- Decoración del cajero -->
  <div class="atm" aria-hidden="true">
    <div class="atm-screen"></div>
    <div class="atm-slot"></div>
    <div class="atm-slot small"></div>
  </div>

  <!-- Decoración de ventanilla -->
  <div class="counter" aria-hidden="true">
    <span class="person p1"></span>
    <span class="person p2"></span>
    <span class="desk"></span>
  </div>
</div>

<main class="login-layout">

  <!-- Panel de marca -->
  <section class="brand-panel">
    <div class="brand-logo" aria-hidden="true">
      <span class="logo-dot"></span>
    </div>

    <h1 class="brand-name">Banca Digital</h1>
    <p class="brand-tagline">Confía en nosotros</p>
  </section>

  <!-- Panel del formulario -->
  <section class="form-panel">
    <form
      class="login-form"
      autocomplete="off"
      (ngSubmit)="ingresar()">

      <h2 class="form-title">Iniciar sesión</h2>
      <p class="form-subtitle">
        Ingresa tus datos para acceder a tu cuenta
      </p>

      <!-- Rol -->
      <div class="field">
        <label for="rol">Tipo de usuario</label>

        <select
          id="rol"
          name="rol"
          [(ngModel)]="rol"
          required>
          <option value="" disabled>Selecciona tu rol</option>
          <option value="ADMIN">Administrador</option>
          <option value="CLIENTE">Cliente</option>
          <option value="ASESOR">Asesor de Crédito</option>
          <option value="CAJERO">Cajero</option>
        </select>
      </div>

      <!-- Usuario -->
      <div class="field">
        <label for="usuario">Usuario</label>

        <div class="input-wrap">
          <input
            type="text"
            id="usuario"
            name="username"
            [(ngModel)]="username"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            required>

          <svg
            class="input-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
          </svg>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="field">
        <label for="password">Contraseña</label>

        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required>

          <svg
            class="input-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect>
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path>
          </svg>
        </div>
      </div>

      <!-- Botón -->
      <button type="submit" class="btn-login">
        Iniciar sesión
      </button>

      <p class="forgot">
        <a href="#" (click)="$event.preventDefault()">
          ¿Olvidaste tu contraseña?
        </a>
      </p>

    </form>
  </section>

</main>
```
