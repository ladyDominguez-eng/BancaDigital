<h1 class="vista-titulo">Registrar retiros</h1>

@if (mensaje()) {
  <p class="vista-aviso" [class.error]="esError()">{{ mensaje() }}</p>
}

<section class="vista-panel">
  <form class="vista-form" (ngSubmit)="retirar()">
    <div class="vista-campo">
      <label for="cuenta">Número de cuenta</label>
      <input id="cuenta" name="cuenta" type="text" [(ngModel)]="numeroCuenta" placeholder="Ej: 001-0000010" autocomplete="off">
    </div>

    <div class="vista-campo">
      <label for="monto">Monto (S/)</label>
      <input id="monto" name="monto" type="number" min="0" step="0.01" [(ngModel)]="monto" placeholder="0.00">
    </div>

    <button type="submit" class="vista-btn">Retirar</button>
  </form>
</section>
